name: Build & publish

# Builds the app and publishes the static site to the `gh-pages` branch.
# That branch is served two ways with no extra setup:
#   • instantly via a CDN preview (raw.githack.com / statically.io)
#   • as a GitHub Pages site IF you later enable Pages from the gh-pages branch
# We publish by pushing to the branch (only needs contents: write), so this
# does not require the Pages API permission that blocked the previous setup.

on:
  push:
    branches: [claude/financial-advisor-app-7q7k7e]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build # relative base ('./') — portable to any path

      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll            # serve asset folders verbatim on Pages
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.email=ci@fincas.local -c user.name=fincas-ci \
            commit -qm "Deploy ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
