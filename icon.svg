<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fincas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#27493d"/>
      <stop offset="1" stop-color="#173029"/>
    </linearGradient>
    <linearGradient id="leaf" x1="300" y1="120" x2="392" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fc8a8"/>
      <stop offset="1" stop-color="#5f9e84"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- rising cash-flow line -->
  <path d="M120 360 L208 300 L268 332 L360 196"
        stroke="#f3ead2" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- node dots on the line -->
  <circle cx="120" cy="360" r="15" fill="#f3ead2"/>
  <circle cx="208" cy="300" r="15" fill="#f3ead2"/>
  <circle cx="268" cy="332" r="15" fill="#f3ead2"/>
  <!-- sprout leaf at the top of the climb -->
  <path d="M360 196 C360 150 384 120 392 120 C392 158 380 192 360 196 Z" fill="url(#leaf)"/>
  <path d="M360 200 C352 170 326 150 318 152 C326 182 344 200 360 200 Z" fill="#6fae93"/>
  <!-- baseline -->
  <line x1="112" y1="404" x2="400" y2="404" stroke="#3c6354" stroke-width="14" stroke-linecap="round"/>
</svg>
